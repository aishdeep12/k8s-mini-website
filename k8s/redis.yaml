# Redis = the job queue between web pods and OCR worker pods (plus job status storage).
# Fine for learning. In production use a managed Redis (ElastiCache, Memorystore, Azure Cache).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]   # in-memory only; data is lost if the pod restarts
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis              # other pods reach it at redis:6379
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
