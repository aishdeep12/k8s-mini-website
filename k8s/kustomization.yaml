apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mini-web
resources:
  - namespace.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - ocr-worker.yaml
images:
  - name: mini-web-image
    # The pipeline rewrites these two lines on every successful build of main.
    newName: ghcr.io/aishdeep12/k8s-mini-website
    newTag: latest
